  call_agent_async: client_fe.runner.call_agent_async
  Callable: collections.abc.Callable
  CallbackContext: google.adk.agents.callback_context.CallbackContext
  ConfigError: common_utils.exceptions.ConfigError
  configparser: configparser
  Console: rich.console.Console
  Content: google.genai.types.Content
  create_file_batches: tools.create_file_batches
  current_config: llms_gen_agent.config.current_config
  dataclass: dataclasses.dataclass
  discover_files: tools.discover_files
  document_summariser_agent: agent.document_summariser_agent
  finalize_summaries: tools.finalize_summaries
  find_dotenv: dotenv.find_dotenv
  Gemini: google.adk.models.google_llm.Gemini
  generate_llms_txt: tools.generate_llms_txt
  GenerateContentConfig: google.genai.types.GenerateContentConfig
  HttpRetryOptions: google.genai.types.HttpRetryOptions
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  LlmResponse: google.adk.models.llm_response.LlmResponse
  load_dotenv: dotenv.load_dotenv
  logger: config.logger
  LoopAgent: google.adk.agents.LoopAgent
  math: math
  os: os
  Part: google.genai.types.Part
  pathspec: pathspec
  process_batch_selection: tools.process_batch_selection
  ProjectSummaryOutput: llms_gen_agent.schema_types.ProjectSummaryOutput
  re: re
  read_files: tools.read_files
  root_agent: llms_gen_agent.agent.root_agent
  Runner: google.adk.runners.Runner
  SequentialAgent: google.adk.agents.SequentialAgent
  setup_config: config.setup_config
  setup_logger: common_utils.logging_utils.setup_logger
  StateKeys: llms_gen_agent.constants.StateKeys
  ToolContext: google.adk.tools.ToolContext
  typer: typer
  update_summaries: tools.update_summaries

functions:
  __str__:
    type: sync
    module: src.llms_gen_agent.config
    args: [self]
  _get_env_var:
    type: sync
    module: src.llms_gen_agent.config
    args: [key, default_value, type_converter]
  _get_gitignore:
    type: sync
    module: src.llms_gen_agent.tools
    args: [repo_path]
    params:
      returns: pathspec.PathSpec
  _get_llms_txt_base_url:
    type: sync
    module: src.llms_gen_agent.tools
    args: [repo_path]
    params:
      returns: str
  _get_remote_url_from_git_config:
    type: sync
    module: src.llms_gen_agent.tools
    args: [git_config_path]
  _get_repo_details:
    type: sync
    module: src.llms_gen_agent.tools
    args: [repo_path]
    params:
      returns: tuple
  _map_files_to_effective_sections:
    type: sync
    module: src.llms_gen_agent.tools
    args: [all_files, repo_path, max_depth]
    params:
      returns: dict
  _write_llms_txt_section:
    type: sync
    module: src.llms_gen_agent.tools
    args: [f, directory, repo_path, files, file_to_effective_section_dir, doc_summaries, base_url]
  call_agent_async:
    type: async
    module: src.client_fe.runner
    args: [query]
    params:
      returns: None
  clean_json_callback:
    type: sync
    module: src.llms_gen_agent.sub_agents.doc_summariser.agent
    args: [callback_context, llm_response]
  create_file_batches:
    type: sync
    module: src.llms_gen_agent.sub_agents.doc_summariser.tools
    args: [tool_context, batch_size]
    params:
      returns: list[list[str]]
  discover_files:
    type: sync
    module: src.llms_gen_agent.tools
    args: [repo_path, tool_context]
    params:
      returns: dict
  finalize_summaries:
    type: sync
    module: src.llms_gen_agent.sub_agents.doc_summariser.tools
    args: [tool_context]
    params:
      returns: dict
  generate:
    type: sync
    module: src.client_fe.cli
    args: [repo_path, output_path, log_level, max_files_to_process]
  generate_llms_txt:
    type: sync
    module: src.llms_gen_agent.tools
    args: [repo_path, tool_context, output_path]
    params:
      returns: dict
  invalidate:
    type: sync
    module: src.llms_gen_agent.config
    args: [self]
  process_batch_selection:
    type: sync
    module: src.llms_gen_agent.sub_agents.doc_summariser.tools
    args: [tool_context]
    params:
      returns: dict
  read_files:
    type: sync
    module: src.llms_gen_agent.sub_agents.doc_summariser.tools
    args: [tool_context]
    params:
      returns: dict
  setup_config:
    type: sync
    module: src.llms_gen_agent.config
    params:
      returns: Config
  setup_session_and_runner:
    type: async
    module: src.client_fe.runner
  update_summaries:
    type: sync
    module: src.llms_gen_agent.sub_agents.doc_summariser.tools
    args: [tool_context]
    params:
      returns: dict

variables:
  AGENT_NAME:
    type: env
    params:
      caller: [os.environ.get]
      path: [find_dotenv()]
  key:
    type: env
    params:
      caller: [os.environ.get]
      path: [find_dotenv()]
  LOG_LEVEL:
    type: env
    params:
      caller: [os.environ]
  MAX_FILES_TO_PROCESS:
    type: env
    params:
      caller: [os.environ]

files:
  .gitignore:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [repo_path, .gitignore]
  effective_section_relative_path:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [repo_path, effective_section_relative_path]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [open, os.path.dirname, os.path.basename]
      alias: [f]
  git_config_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, config.read]
  gitignore_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open]
  llms.txt:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [temp_dir, llms.txt]
  llms_txt_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  output_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, os.makedirs]
  output_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.dirname]
  relative_file_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.dirname]
  repo_path:
    type: variable
    actions: [read]
    params:
      caller: [os.walk]
  temp_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
